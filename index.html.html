<script>
/* ================= DATA (saved in this browser only) ================= */
var DEFAULT_ADMIN_HASH='fcd81cc070a77791edd4ced4f86481ca3ac8ddfbe05998d5b546ce6a599f10ef';
var DEFAULT_SUPER_HASH='8df24a74659b00e40ee5922e22ba34f8235fcb360c54111fcd54f07107cae8fc';
var SUPER_PERMS_DEFAULT={dashboard:true,adminOrders:true,adminCustomers:true,adminFinance:true,adminServices:true,adminDeals:true,adminReviews:true,adminSettings:true};
var DEFAULT_TRIAL_DAYS=30;
async function H(x){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('salonpro|'+x));return Array.from(new Uint8Array(b)).map(function(c){return c.toString(16).padStart(2,'0')}).join('')}
var DEFAULT_TAGLINE='Book a service and follow your order live.';
var DEF_P='#8b5cf6', DEF_S='#ec4899';
var KEY='salonpro_offline_db', SKEY='salonpro_offline_session';

/* default icons for every button (admin can change them) */
var ICON_DEF=[
 ['logo','Logo (jab image na ho)','✂'],
 ['dashboard','Admin: Dashboard','⌂'],['adminOrders','Admin: Orders','▣'],['adminCustomers','Admin: Customers','👥'],
 ['adminFinance','Admin: Finance','💰'],['adminServices','Admin: Services','✂'],['adminDeals','Admin: Deals','🏷'],
 ['adminReviews','Admin: Reviews','⭐'],['adminSettings','Admin: Settings','⚙'],['superAdmin','Super Admin','🛡️'],['superLogin','Super Admin','🛡️'],
 ['home','Customer: Home','⌂'],['services','Customer: Services','✂'],['orders','Customer: My Orders','▣'],
 ['notifs','Customer: Notifications','🔔'],['profile','Customer: Profile','●'],['settings','Customer: Settings','⚙'],
 ['logout','Logout','↪']
];
var COLOR_PRESETS=[['Purple','#8b5cf6','#ec4899'],['Ocean','#0ea5e9','#6366f1'],['Emerald','#10b981','#14b8a6'],['Sunset','#f97316','#ef4444'],['Rose','#e11d48','#f472b6'],['Gold','#ca8a04','#f59e0b'],['Black','#334155','#0f172a']];

function loadDB(){
  var db=null;
  try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!db||typeof db!=='object')db={};
  ['users','orders','notifs','expenses','deals','feedback'].forEach(function(k){if(!Array.isArray(db[k]))db[k]=[]});
  if(!db.adminPass)db.adminPass=DEFAULT_ADMIN_HASH;
  if(!db.superAdminPass)db.superAdminPass=DEFAULT_SUPER_HASH;
  if(!db.adminPermissions||typeof db.adminPermissions!=='object')db.adminPermissions=JSON.parse(JSON.stringify(SUPER_PERMS_DEFAULT));
  if(!db.adminAccounts||!Array.isArray(db.adminAccounts))db.adminAccounts=[{id:'admin-main',name:'Regular Admin',createdAt:Date.now()}];
  if(!db.freeTrial||typeof db.freeTrial!=='object')db.freeTrial={enabled:false,durationDays:DEFAULT_TRIAL_DAYS,startedAt:0};
  if(!Number(db.freeTrial.durationDays)||Number(db.freeTrial.durationDays)<1)db.freeTrial.durationDays=DEFAULT_TRIAL_DAYS;
  if(typeof db.freeTrial.enabled!=='boolean')db.freeTrial.enabled=false;
  if(!db.freeTrial.startedAt)db.freeTrial.startedAt=0;
  if(!db.shopName)db.shopName='SalonPro';
  if(!db.adminHeading)db.adminHeading='Welcome Owner';
  if(!db.tagline)db.tagline=DEFAULT_TAGLINE;
  if(!db.colorP)db.colorP=DEF_P;
  if(!db.colorS)db.colorS=DEF_S;
  if(!db.icons||typeof db.icons!=='object')db.icons={};
  if(!db.contact||typeof db.contact!=='object')db.contact={name:'',phone:'',email:'',addr:''};
  if(!db.services||!db.services.length){
    db.services=[
      {id:'s1',name:'Faisal Haircut',price:500,duration:30,desc:'Modern haircut and styling'},
      {id:'s2',name:'Hair Styling',price:800,duration:45,desc:'Professional hair styling'},
      {id:'s3',name:'Beard Trim',price:300,duration:20,desc:'Professional beard shaping'},
      {id:'s4',name:'Hair Wash',price:250,duration:15,desc:'Refreshing hair wash'},
      {id:'s5',name:'Face Cleanup',price:600,duration:30,desc:'Basic facial cleanup'},
      {id:'s6',name:'Hair Color',price:1500,duration:90,desc:'Professional hair coloring'}
    ];
  }
  localStorage.setItem(KEY,JSON.stringify(db));
  return db;
}
var DB=loadDB();
function sameJSON(a,b){try{return JSON.stringify(a)===JSON.stringify(b)}catch(e){return false}}
function markChanged(before,after,now){
  var arrs=['users','orders','notifs','expenses','deals','feedback'],del=after._deletedIds||{};
  arrs.forEach(function(k){
    var ba=before[k]||[],aa=after[k]||[],bm={},am={};
    ba.forEach(function(x){bm[x.id]=x}); aa.forEach(function(x){am[x.id]=1;if(!bm[x.id]||!sameJSON(bm[x.id],x))x._updatedAt=now});
    del[k]=del[k]||[]; ba.forEach(function(x){if(x.id&&!am[x.id]&&del[k].every(function(d){return d.id!==x.id}))del[k].push({id:x.id,t:now})});
  });
  after._deletedIds=del;
  var rootKeys=['adminPass','superAdminPass','adminPermissions','adminAccounts','freeTrial','shopName','adminHeading','tagline','colorP','colorS','icons','contact','services','bannerVideo','vid','bannerVersion','logoVersion'];
  for(var i=0;i<rootKeys.length;i++){var k=rootKeys[i];if(!sameJSON(before[k],after[k])){after._settingsUpdatedAt=now;break}}
  after._lastSavedAt=now;
}
function save(){var j=JSON.stringify(DB);localStorage.setItem(KEY,j);if(window.cloudPush)window.cloudPush(j)}
/* Work from the latest local copy and mark changed records for safe cloud merging. */
function upd(fn){DB=loadDB();var before=JSON.parse(JSON.stringify(DB));fn();markChanged(before,DB,Date.now());save()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function byId(arr,id){return arr.filter(function(x){return x.id===id})[0]}
/* notifications are stored as type + params, so the customer sees them in his own language */
function pushNotif(userId,type,p,orderId){DB.notifs.push({id:uid(),userId:userId,type:type,p:p||{},time:Date.now(),read:false,orderId:orderId||''})}

/* Persistent login:
   - User, Admin and Super Admin sessions are stored in localStorage.
   - Closing/restarting the browser or phone does not log the account out.
   - Only explicit Logout clears the saved session.
   - A legacy sessionStorage session is migrated once to localStorage.
*/
function getSession(){
  try{
    var saved=localStorage.getItem(SKEY);
    if(saved)return JSON.parse(saved);
    var legacy=sessionStorage.getItem(SKEY);
    if(legacy){
      localStorage.setItem(SKEY,legacy);
      sessionStorage.removeItem(SKEY);
      return JSON.parse(legacy);
    }
  }catch(e){}
  return null;
}
function setSession(s){
  try{
    sessionStorage.removeItem(SKEY);
    localStorage.removeItem(SKEY);
    if(!s)return;
    s.persistent=true;
    s.sessionVersion=2;
    s.sessionToken=s.sessionToken||(
      (crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2))
    );
    localStorage.setItem(SKEY,JSON.stringify(s));
  }catch(e){
    console.error('Could not persist login session',e);
  }
}

function shrink(f,max,q,type){return new Promise(function(res,rej){
  var im=new Image(),u=URL.createObjectURL(f);
  im.onload=function(){var k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL(type,q))};
  im.onerror=rej;im.src=u;
})}
function saveMedia(n,f,max,q,type,okMsg){
  if(!f)return;
  if(f.type.indexOf('image')!==0){toast(n==='banner'?'For online storage, please choose an image. For a video, provide a link.':'Sirf image file chunein.');return}
  if(!window.cloudMediaSet){toast('The database has not loaded yet. Please try again.');return}

    return d;
  }).then(function(d){return window.cloudMediaSet(n,d).then(function(){mediaChanged(n,d);toast(okMsg);if(n==='logo')render()})})
  .catch(function(){toast('The changes could not be saved. Please check the Firestore rules.')});
}

function dueCheck(){
  var s=getSession(),el=$('dueAlert'),o=null,now=Date.now();
  if(s&&s.role==='user'){
    o=DB.orders.filter(function(x){
      if(x.userId!==s.id||dueDismissed[x.id]||!x.confirmedTime||x.visitReply||(x.status!=='accepted'&&x.status!=='ready'))return false;
      var ct=new Date(x.confirmedTime).getTime();
      return now>=ct&&now<ct+1800000;
    })[0];
  }
  if(!o){if(el)el.remove();return}
  var key=o.id+lang();
  if(!el||el.getAttribute('data-key')!==key){
    if(!el){el=document.createElement('div');el.id='dueAlert';document.documentElement.appendChild(el)}

  }
  var dk=o.id+'|'+o.confirmedTime;
  if(!dueSent[dk]){
    dueSent[dk]=1;
    var oid=o.id;
    upd(function(){var q=byId(DB.orders,oid);if(q&&!q.dueNotified){q.dueNotified=true;pushNotif(q.userId,'due',{service:q.service},q.id)}});
    var lk='salonDueN|'+dk,seen=false;
    try{seen=!!localStorage.getItem(lk);if(!seen)localStorage.setItem(lk,'1')}catch(e){}
    if(!seen)notifyDue(t('due_title'),o.service+' — '+appt(o.confirmedTime));
    render();
  }
}

  var bd=$('bigdate');if(bd)bd.textContent=now.toLocaleDateString('en-PK',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
  var pbs=document.querySelectorAll('.pb');
  for(var q=0;q<pbs.length;q++){var a=+pbs[q].getAttribute('data-start'),z=+pbs[q].getAttribute('data-end'),f=(z-Date.now())/Math.max(1,z-a);pbs[q].style.width=Math.max(0,Math.min(1,f))*100+'%'}
  var els=document.querySelectorAll('.cd');
  for(var i=0;i<els.length;i++){
    var el=els[i],l=fmtLeft(+el.getAttribute('data-end')-Date.now());
    el.textContent=l?l:(el.getAttribute('data-mode')==='deal'?t('cd_deal_over'):t('cd_due'));
  }
  dueCheck();
  var cm=document.querySelectorAll('.cdm'),nw=Date.now();
  for(var j=0;j<cm.length;j++){var lm=Math.max(0,+cm[j].getAttribute('data-end')-nw),sc=Math.floor(lm/1000);cm[j].textContent=Math.floor(sc/60)+' min '+pad(sc%60)+' sec'}

  for(var k=0;k<ab.length;k++)ab[k].classList.toggle('due',nw>=+ab[k].getAttribute('data-end'));
  boxCheck();
  refreshInstall();
}

var vidURL='',vidVer=0,vidBusy=false;
function ensureVideo(){
  var m=DB.vid;if(!m||vidBusy||vidVer===m.v)return;vidBusy=true;
  idbGet('vid').catch(function(){return null}).then(function(r){
    if(r&&r.v===m.v)return r.blob;
    if(!window.cloudChunkGet)throw 0;
    var ps=[];for(var i=0;i<m.n;i++)ps.push(window.cloudChunkGet(i));
    return Promise.all(ps).then(function(a){
      var parts=[];a.forEach(function(x){var b=atob(x),u=new Uint8Array(b.length);for(var j=0;j<b.length;j++)u[j]=b.charCodeAt(j);parts.push(u)});
      var bl=new Blob(parts,{type:m.type});idbPut('vid',{v:m.v,blob:bl}).catch(function(){});return bl;
    });
  }).then(function(bl){vidURL=URL.createObjectURL(bl);vidVer=m.v;vidBusy=false;render()}).catch(function(){vidBusy=false});
}
function reencode(file){return new Promise(function(res,rej){
  if(!window.MediaRecorder){rej();return}
  var v=document.createElement('video');v.muted=true;v.playsInline=true;v.src=URL.createObjectURL(file);
  v.onerror=rej;
  v.onloadedmetadata=function(){
    var k=Math.min(1,480/v.videoWidth),c=document.createElement('canvas');c.width=Math.round(v.videoWidth*k)&~1;c.height=Math.round(v.videoHeight*k)&~1;
    var x=c.getContext('2d'),mt=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';
    var rec=new MediaRecorder(c.captureStream(25),{mimeType:mt,videoBitsPerSecond:600000}),ch=[],maxT=Math.min(v.duration||12,12);
    rec.ondataavailable=function(e){if(e.data.size)ch.push(e.data)};
    rec.onstop=function(){res(new Blob(ch,{type:'video/webm'}))};
    function draw(){x.drawImage(v,0,0,c.width,c.height);if(v.currentTime>=maxT||v.ended){v.pause();rec.stop();return}requestAnimationFrame(draw)}
    rec.start();v.play().then(draw).catch(rej);
  };
})}
function setBannerVideo(inp){
  var f=inp.files[0];if(!f)return;
  if(f.type.indexOf('video')!==0){toast('Video file chunein.');return}

  toast('The video is being prepared. This may take a few seconds.');
  var go=f.size<=4*1024*1024?Promise.resolve(f):reencode(f);
  go.then(function(bl){
    if(bl.size>6*1024*1024)throw 0;
    return new Promise(function(res){var r=new FileReader();r.onload=function(){res({s:r.result.split(',')[1],t:bl.type||'video/mp4'})};r.readAsDataURL(bl)});
  }).then(function(o){
    var parts=[];for(var i=0;i<o.s.length;i+=700000)parts.push(o.s.slice(i,i+700000));
    return Promise.all(parts.map(function(p,i){return window.cloudChunkSet(i,p)})).then(function(){
      upd(function(){DB.vid={n:parts.length,type:o.t,v:Date.now()}});toast('Banner video lag gayi.');render();

  }).catch(function(){toast('The video could not be saved. Please choose a video up to 12 seconds long.')});
}

var BOX_MS=120000;
function boxEnd(o){
  if(o.status!=='accepted'&&o.status!=='ready')return 0;
  if(o.confirmedTime){var ct=new Date(o.confirmedTime).getTime();return isNaN(ct)?0:ct+BOX_MS}
  return o.confirmedAt?o.confirmedAt+BOX_MS:0;
}
function boxOrders(mine){
  var now=Date.now();

function trialInfo(){
  var f=DB.freeTrial||{enabled:false,durationDays:DEFAULT_TRIAL_DAYS,startedAt:0},now=Date.now(),days=Math.max(1,Number(f.durationDays)||DEFAULT_TRIAL_DAYS);
  if(!f.enabled)return {enabled:false,days:days,remaining:0,expiresAt:0,active:false};
  var started=Number(f.startedAt)||0;
  if(!started)return {enabled:true,days:days,remaining:days,expiresAt:0,active:true};
  var expires=started+days*86400000,remaining=Math.max(0,Math.ceil((expires-now)/86400000));
  return {enabled:true,days:days,remaining:remaining,expiresAt:expires,active:now<expires};
}

function saveFreeTrial(){
  var enabled=$('trialEnabled').checked,days=Math.max(1,Math.min(3650,parseInt($('trialDays').value,10)||DEFAULT_TRIAL_DAYS)),was=DB.freeTrial||{};
  upd(function(){
    if(!DB.freeTrial||typeof DB.freeTrial!=='object')DB.freeTrial={enabled:false,durationDays:DEFAULT_TRIAL_DAYS,startedAt:0};
    var wasEnabled=!!DB.freeTrial.enabled;
    DB.freeTrial.durationDays=days;
    DB.freeTrial.enabled=enabled;
    if(enabled&&!wasEnabled)DB.freeTrial.startedAt=Date.now();
    if(!enabled)DB.freeTrial.startedAt=0;
    if(enabled&&wasEnabled&&!DB.freeTrial.startedAt)DB.freeTrial.startedAt=Date.now();
  });
  if(window.cloudFlush)window.cloudFlush();
  toast(enabled?('Free Trial enabled for '+days+' day(s).'):'Free Trial disabled.');
  render();
}

function completeAppointment(id){
  upd(function(){
    var o=byId(DB.orders,id);
    if(!o)return;
    o.status='done';
    o.doneAt=Date.now();
    pushNotif(o.userId,'done',{service:o.service},o.id);
  });
  toast('Appointment marked as completed.');
  render();
}

function apBoardHTML(){
  var now=Date.now();
  var list=DB.orders.filter(function(o){
    if((o.status!=='accepted'&&o.status!=='ready')||!o.confirmedTime)return false;
    var ct=new Date(o.confirmedTime).getTime();
    return !isNaN(ct)&&now<ct+1800000;
  }).sort(function(a,b){return new Date(a.confirmedTime)-new Date(b.confirmedTime)});
  if(!list.length)return '';
  return "<div class=title><h2>⏰ Upcoming Customers</h2><span class=muted>Live countdown for each confirmed appointment</span></div><div class=apboard>"+list.map(function(o){
    var ct=new Date(o.confirmedTime).getTime();
    var due=now>=ct;
    return "<div class='apbox"+(due?' due':'')+"' data-end='"+ct+"' data-hide='"+(ct+1800000)+"'>"+
    "<div><div class=apt>✂ "+esc(o.userName)+" is scheduled to arrive at the shop</div>"+
    "<div class=muted>Service: <b>"+esc(o.service)+"</b> • 🕒 "+appt(o.confirmedTime)+" • 📞 "+esc(o.phone)+"</div>"+
    (o.visitReply?"<div class=muted style='margin-top:4px'>"+(o.visitReply==='coming'?'✅ Customer is on the way':'❌ Customer is not coming')+"</div>":"")+
    "<div class=ap-due>🔔 The scheduled arrival time has been reached.</div></div>"+
    "<div class=apr><div class=muted>Time remaining</div><b class=cdm data-end='"+ct+"'></b>"+
    "<button class='btn green done-btn' style='margin-top:8px' onclick=\"completeAppointment('"+o.id+"')\">✓ Done</button></div></div>";
  }).join('')+"</div>";
}

/* ---- Finance ---- */
function buildDays(){
  var m={};
  function g(k){return m[k]||(m[k]={day:k,orders:0,done:0,income:0,exp:0})}
  g(dkey(Date.now()));
  DB.orders.forEach(function(o){
    g(dkey(o.createdAt)).orders++;
    if(o.status==='accepted'||o.status==='ready'||o.status==='done'){var r=g(dkey(o.confirmedAt||o.doneAt||o.createdAt));r.done++;r.income+=(+o.price||0)}
  });
  DB.expenses.forEach(function(e){g(e.date).exp+=(+e.amount||0)});
  return Object.keys(m).sort().reverse().map(function(k){return m[k]});
}
function sumDays(arr){return arr.reduce(function(a,d){a.orders+=d.orders;a.done+=d.done;a.income+=d.income;a.exp+=d.exp;return a},{orders:0,done:0,income:0,exp:0})}
function finCard(label,s){

  "<div class=muted style='margin-top:8px'>Kamai (Income)</div><b>"+money(s.income)+"</b>"+
  "<div class=muted style='margin-top:8px'>Kharcha / Bills</div><b>"+money(s.exp)+"</b>"+
  "<div class=muted style='margin-top:8px'>Profit</div><b class='"+(p>=0?'pos':'neg')+"' style='font-size:20px'>"+money(p)+"</b></div>";
}

var _ac=null,notified={};
function ding(){try{
  var A=window.AudioContext||window.webkitAudioContext;if(!A)return;_ac=_ac||new A();if(_ac.state==='suspended')_ac.resume();
  var t0=_ac.currentTime;
  [[880,0],[1175,.16],[1568,.32]].forEach(function(n){var o=_ac.createOscillator(),g=_ac.createGain();o.type='sine';o.frequency.value=n[0];o.connect(g);g.connect(_ac.destination);
    g.gain.setValueAtTime(0.0001,t0+n[1]);g.gain.exponentialRampToValueAtTime(.4,t0+n[1]+.03);g.gain.exponentialRampToValueAtTime(.0001,t0+n[1]+.45);o.start(t0+n[1]);o.stop(t0+n[1]+.5)});
}catch(e){}}
function notifyAdmin(title,body){
  ding();toast('🔔 '+title+(body?' - '+body:''));
  try{if(window.Notification&&Notification.permission==='granted')new Notification(title,{body:body||'',icon:'icon-192.png'})}catch(e){}
}

}
function confirmModal(id){
  DB=loadDB();

  var isNew=o.status==='pending';
  modal("<h2>"+(isNew?'🔔 New Order':'🕒 Change Appointment Time')+"</h2>"+
  "<p><b>"+esc(o.userName)+"</b>  placed the order at <b>"+when(o.createdAt)+"</b> par order kiya hai.</p>"+
  "<div class=timebox style='margin-bottom:12px'>✂ <b>"+esc(o.service)+"</b> — "+money(o.price)+"<br>📞 "+esc(o.phone)+"<br>✉️ "+esc(o.email)+"<br>📅 Customer's requested time:<br><b>"+appt(o.appointment)+"</b>"+(o.note?"<br>📝 "+esc(o.note):"")+"</div>"+
  "<p>"+(isNew?'<b>Would you like to confirm this order?</b>':'<b>Choose a new appointment time:</b>')+"</p>"+
  "<form class=form onsubmit=\"event.preventDefault();doConfirm('"+id+"')\">"+
  "<div class=field><label>When should the customer arrive at the shop?</label><input id=ct type=datetime-local value='"+esc(o.confirmedTime||o.appointment)+"' required></div>"+
  "<div class=field><label>Message for the customer (optional)</label><input id=cm></div>"+
  "<button class='btn primary'>✔ Confirm</button>"+
  (isNew?"<button type=button class='btn red' onclick=\"doReject('"+id+"')\">✖ Reject</button>":"")+
  "<button type=button class=btn onclick='closeM()'>"+(isNew?'Baad mein':'Cancel')+"</button></form>");

function doConfirm(id){
  var tt=$('ct').value,mx=$('cm').value.trim();
  if(!tt){toast('Please enter a time.');return}
  upd(function(){
    var o=byId(DB.orders,id);if(!o)return;
    var changed=!!o.confirmedTime;
    if(o.status==='pending')o.status='accepted';
    if(!o.confirmedAt)o.confirmedAt=Date.now();
    o.confirmedTime=tt;o.confirmedAt=Date.now();
    o.dueNotified=false;
    pushNotif(o.userId,changed?'retime':'confirm',{service:o.service,time:tt,msg:mx},o.id);
  });
  toast('Order confirmed. The customer has been notified.');
  closeM();
}
function doReject(id){
  if(!confirm('Reject this order?'))return;
  upd(function(){
    var o=byId(DB.orders,id);if(!o)return;
    o.status='rejected';
    pushNotif(o.userId,'rejected',{service:o.service},o.id);
  });
  toast('Order rejected.');
  closeM();
}
function stat(id,s){
  DB=loadDB();
  var o0=byId(DB.orders,id);
  if(s==='accepted'&&!o0.confirmedTime){confirmModal(id);return}
  upd(function(){
    var o=byId(DB.orders,id);if(!o)return;
    var was=o.status;o.status=s;
    if((s==='accepted'||s==='ready'||s==='done')&&!o.confirmedAt)o.confirmedAt=Date.now();
    if(s==='done'&&was!=='done')o.doneAt=Date.now();
    if(s!=='done')o.doneAt=null;
    if(s!==was){
      if(s==='ready'||s==='done'||s==='rejected'||s==='accepted')pushNotif(o.userId,s,{service:o.service},o.id);
    }
  });
  toast('The customer has been notified of the status change.');render();
}

function restore(inp){
  var f=inp.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.orders)||!Array.isArray(d.users))throw 0;
      if(!confirm('The current data will be replaced. Continue?'))return;
      DB=d;save();DB=loadDB();toast('Data restored successfully.');render();
    }catch(e){toast('Ghalat backup file.')}
  };
  r.readAsText(f);
}

function typing(){var a=document.activeElement;return !!a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)}
function remoteChanged(){
  var s=getSession(),before={},fbBefore=DB.feedback.length,ob={},vr={};
  DB.orders.forEach(function(o){ob[o.id]=1;vr[o.id]=o.visitReply||''});
  DB.notifs.forEach(function(n){before[n.id]=1});
  var oldB=DB.bannerVersion,oldL=DB.logoVersion;
  DB=loadDB();
  theme();
  if(oldB!==DB.bannerVersion)loadBanner();
  if(oldL!==DB.logoVersion)loadLogo();
  if(s&&s.role==='user'){
    var fresh=DB.notifs.filter(function(n){return n.userId===s.id&&!before[n.id]});
    if(fresh.length)toast('🔔 '+nText(fresh[fresh.length-1]));
  }
  if(s&&s.role==='admin'){
    if(DB.feedback.length>fbBefore)toast('⭐ New review or complaint received');
    DB.orders.forEach(function(o){
      if(o.status==='pending'&&!ob[o.id]&&!notified[o.id]){notified[o.id]=1;notifyAdmin('A new order has arrived',o.userName+' - '+o.service)}
      if(o.visitReply&&vr[o.id]!==o.visitReply)notifyAdmin(o.visitReply==='coming'?'Customer is on the way':'Customer is not coming',o.userName+' - '+o.service);
    });
  }
  if(!s){if(authScreen==='guest')guestHome();return}
  /* do not wipe what someone is typing; refresh after he leaves the field */
  if(typing()){pendingRender=true;return}
  render();
}
window.addEventListener('storage',function(e){if(e.key===KEY)remoteChanged()});
document.addEventListener('focusout',function(){
  if(!pendingRender)return;

});

/* ================= INSTALL APP (PWA) ================= */
var deferredInstall=null;
function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone}
function instLabel(){return lang()==='ur'?'📲 ایپ انسٹال کریں':'📲 Install app'}
function hideInstall(){var b=$('installBar');if(b)b.remove();document.body.classList.remove('hasinstall')}
function showInstall(){
  if(isStandalone()||$('installBar'))return;
  var d=document.createElement('div');d.id='installBar';
  d.innerHTML="<button class='btn primary' onclick='doInstall()'>"+instLabel()+"</button>";
  document.documentElement.appendChild(d);
  document.body.classList.add('hasinstall');
}
function refreshInstall(){
  if(isStandalone()){hideInstall();return}
  if(!$('installBar')){showInstall();return}
  var b=$('installBar').firstChild,l=instLabel();
  if(b&&b.textContent!==l)b.textContent=l;
}
function installBtn(){return ''}
function doInstall(){
  if(deferredInstall){
    var ev=deferredInstall;deferredInstall=null;
    ev.prompt();
    ev.userChoice.then(function(r){if(r&&r.outcome==='accepted')hideInstall()}).catch(function(){});
    return;
  }
  /* iPhone/iPad: Safari has no install API, so open the share sheet directly */
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&navigator.share){
    navigator.share({title:DB.shopName,url:location.href}).catch(function(){});
    return;
  }
  toast(lang()==='ur'?'انسٹال ابھی تیار ہو رہا ہے، دوبارہ دبائیں':'Install is getting ready - tap again in a moment');
}
(function(){
  window.updateInstallManifest=function(){
    try{
      var iconSrc=logoURL || '';
      if(!iconSrc){
        var c=document.createElement('canvas');
        c.width=c.height=512;
        var x=c.getContext('2d'),g=x.createLinearGradient(0,0,512,512);
        g.addColorStop(0,DB.colorP||'#8b5cf6');g.addColorStop(1,DB.colorS||'#ec4899');
        x.fillStyle=g;x.fillRect(0,0,512,512);
        x.fillStyle='#fff';x.font='bold 150px Arial';x.textAlign='center';x.textBaseline='middle';
        x.fillText('✂',256,270);
        iconSrc=c.toDataURL('image/png');
      }
      var m={
        name:DB.shopName||'SalonPro',
        short_name:(DB.shopName||'SalonPro').slice(0,12),
        start_url:location.origin+location.pathname,
        scope:location.origin+'/',
        display:'standalone',
        background_color:'#ffffff',
        theme_color:DB.colorP||'#8b5cf6',
        icons:[
          {src:iconSrc,sizes:'192x192',type:'image/png',purpose:'any maskable'},
          {src:iconSrc,sizes:'512x512',type:'image/png',purpose:'any maskable'}
        ]
      };
      var old=document.querySelector('link[data-salon-dynamic-manifest]');
      if(old)old.remove();
      var l=document.createElement('link');
      l.rel='manifest';
      l.setAttribute('data-salon-dynamic-manifest','1');
      l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));
      document.head.appendChild(l);
    }catch(e){console.error('Manifest update failed',e)}
  };
  fetch('manifest.json',{cache:'no-store'}).then(function(r){
    if(!r.ok)window.updateInstallManifest();
    else window.updateInstallManifest();
  }).catch(function(){window.updateInstallManifest()});
})(); 
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredInstall=e;showInstall()});
window.addEventListener('appinstalled',hideInstall);
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
/* ================= START ================= */
getSession(); /* migrate any old sessionStorage login to persistent localStorage */
theme();

loadBanner();

let ready=false,pushing=false,queued=null;
function parse(x){try{return JSON.parse(x)}catch(e){return null}}
function mergeArrays(local,remote,ldel,rdel){
  const out={};
  (remote||[]).forEach(x=>{if(x&&x.id)out[x.id]=x});
  (local||[]).forEach(x=>{if(!x||!x.id)return;const r=out[x.id];if(!r||Number(x._updatedAt||0)>=Number(r._updatedAt||0))out[x.id]=x});
  const dels={};
  (rdel||[]).concat(ldel||[]).forEach(d=>{if(d&&d.id)dels[d.id]=Math.max(dels[d.id]||0,Number(d.t||0))});
  Object.keys(dels).forEach(id=>{if(out[id]&&dels[id]>=Number(out[id]._updatedAt||0))delete out[id]});
  return Object.keys(out).map(k=>out[k]);
}
function mergeDB(local,remote){
  if(!remote)return local||{}; if(!local)return remote;
  const m=JSON.parse(JSON.stringify(remote)),ld=local._deletedIds||{},rd=remote._deletedIds||{};
  m._deletedIds={};
  ["users","orders","notifs","expenses","deals","feedback"].forEach(k=>{
    m[k]=mergeArrays(local[k],remote[k],ld[k],rd[k]);
    m._deletedIds[k]=(rd[k]||[]).concat(ld[k]||[]);
  });
  const lk=Number(local._settingsUpdatedAt||0),rk=Number(remote._settingsUpdatedAt||0);
  if(lk>rk){
    ["adminPass","superAdminPass","adminPermissions","adminAccounts","freeTrial","shopName","adminHeading","tagline","colorP","colorS","icons","contact","services","bannerVideo","vid","bannerVersion","logoVersion"].forEach(k=>{if(local[k]!==undefined)m[k]=local[k]});
    m._settingsUpdatedAt=lk;
  }
  m._lastSavedAt=Math.max(Number(local._lastSavedAt||0),Number(remote._lastSavedAt||0));
  return m;
}
async function pushJson(j){
  queued=j;if(!ready||pushing)return;pushing=true;
  try{while(queued){const q=queued;queued=null;await setDoc(ref,{json:q,t:Date.now()})}}
  catch(e){console.error(e);queued=j;toast("Could not save your changes online. Please check your internet connection.")}
  finally{pushing=false}
}
window.cloudPush=pushJson;
window.cloudReady=()=>ready;
window.cloudFlush=()=>pushJson(localStorage.getItem(KEY)||JSON.stringify(DB));

onSnapshot(ref,snap=>{
  if(snap.metadata.hasPendingWrites)return;
  const remote=snap.exists()?parse(snap.data().json):null,local=parse(localStorage.getItem(KEY)||"");
  if(!remote){ready=true;pushJson(JSON.stringify(local||loadDB()));return}
  ready=true;
  const merged=mergeDB(local,remote),mj=JSON.stringify(merged),rj=JSON.stringify(remote),lj=JSON.stringify(local);
  if(mj!==rj)pushJson(mj);
  if(mj!==lj){localStorage.setItem(KEY,mj);remoteChanged()}
},e=>{console.error(e);toast("Could not connect to the online database. Please check your internet connection.")});
</script>
